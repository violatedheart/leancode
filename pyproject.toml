[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leancode"
version = "0.1.0"
description = "A token-frugal local coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "tree-sitter-language-pack>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leancode = "leancode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
